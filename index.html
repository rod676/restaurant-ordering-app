<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="index.css">
       <title>Jimmy's Diner</title>
    </head>
    <body>
        <div class="container">
            <header class="hero">
                <img src="img/burger.webp" alt="image of burger">
                <h1>Jimmy's Diner</h1>
                <p>the best burgers and pizzas in town.</p>
            </header>
            <main id="menu" aria-label="Menu"></main>
            <section id= "cart"></section>
        </div>
        <form class="payment-cart" id="payment-cart">
                <h1>Enter card details</h1>
                <input type="text" id="client-name" placeholder="Enter your name" required>
                <input type="number" placeholder="Enter cart number" required minlength="16">
                <input type="number" placeholder="Enter CVV" required maxlength="3">
            
            <button type="submit" id="pay-btn" class="pay-btn">Pay</button>
        </form>
        
       
        
	<script src="index.js" type="module"></script>
    </body>
</html>
